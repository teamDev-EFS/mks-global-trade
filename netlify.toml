# MSK Global Trade — Vite + React SPA (frontend only)
# Docs: https://docs.netlify.com/configure-builds/overview/

[build]
  # Install runs automatically (npm install). Then:
  command = "npm run build"
  # Vite output directory
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# -----------------------------------------------------------------------------
# Netlify UI checklist (Site settings → Environment variables)
# Set BEFORE first deploy or trigger "Clear cache and deploy" after changing:
#
#   VITE_SITE_URL              = https://your-site.netlify.app  (no trailing slash)
#                              Use your custom domain once connected.
#   VITE_API_URL               = https://your-api.example.com   (backend base URL; no /api suffix unless your client expects it)
#   VITE_GA_MEASUREMENT_ID     = G-XXXXXXXXXX                   (optional, GA4)
#   VITE_GOOGLE_SITE_VERIFICATION = ...                        (optional, Search Console)
#
# Vite inlines VITE_* at build time — redeploy after any change.
# -----------------------------------------------------------------------------

# SPA: React Router — non-file routes must serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long cache for hashed assets (Vite emits under /assets/)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

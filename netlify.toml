# MSK Global Trade — Vite + React SPA
# In Netlify: Site settings → Environment variables → add VITE_API_URL = https://<your-vercel-api>.vercel.app
# (no trailing slash). Redeploy after changing env vars so Vite inlines them at build time.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Client-side routing: all paths serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

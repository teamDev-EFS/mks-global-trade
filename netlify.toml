# MSK Global Trade — Vite + React SPA (frontend only)
# Docs: https://docs.netlify.com/configure-builds/overview/

[build]
  # Install runs automatically (npm install). Then:
  command = "npm run build"
  # Vite output directory
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# -----------------------------------------------------------------------------
# Netlify UI checklist (Site settings → Environment variables)
# Set BEFORE first deploy or trigger "Clear cache and deploy" after changing:
#
#   VITE_SITE_URL              = https://www.mskglobaltrade.com
#   VITE_API_URL               = (leave empty — Netlify proxy handles it)
#   VITE_GA_MEASUREMENT_ID     = G-XXXXXXXXXX  (optional, GA4)
#   VITE_GOOGLE_SITE_VERIFICATION = ...         (optional, Search Console)
#
# Vite inlines VITE_* at build time — redeploy after any change.
# -----------------------------------------------------------------------------

# Single canonical host: apex → www (stops duplicate URLs and weak Google snippets)
[[redirects]]
  from = "/*"
  to = "https://www.mskglobaltrade.com/:splat"
  status = 301
  force = true
  conditions = {Host = ["mskglobaltrade.com"]}

# Proxy /api/* requests to Railway backend — avoids CORS issues in production
[[redirects]]
  from = "/api/*"
  to = "https://mks-global-trade-api-production.up.railway.app:8080/api/:splat"
  status = 200
  force = true

# SPA: React Router — non-file routes must serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long cache for hashed assets (Vite emits under /assets/)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

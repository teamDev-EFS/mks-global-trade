# MSK Global Trade — Vite + React SPA (frontend only)
# Docs: https://docs.netlify.com/configure-builds/overview/

[build]
  # Install runs automatically (npm install). Then:
  command = "npm run build"
  # Vite output directory
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# -----------------------------------------------------------------------------
# Netlify UI checklist (Site settings → Environment variables)
# Set BEFORE first deploy or trigger "Clear cache and deploy" after changing:
#
#   VITE_SITE_URL              = https://www.mskglobaltrade.com
#   VITE_API_URL               = https://msk-global-trade-backend.vercel.app
#   VITE_GA_MEASUREMENT_ID     = G-XXXXXXXXXX  (optional, GA4)
#   VITE_GOOGLE_SITE_VERIFICATION = ...         (optional, Search Console)
#
# Vite inlines VITE_* at build time — redeploy after any change.
# -----------------------------------------------------------------------------

# Proxy /api/* requests to Render backend — avoids CORS issues in production
# IMPORTANT: Update the URL below after creating the Render service
[[redirects]]
  from = "/api/*"
  to = "https://mks-global-trade-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA: React Router — non-file routes must serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long cache for hashed assets (Vite emits under /assets/)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
